<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff9ec4">
<meta name="robots" content="noindex, nofollow"><!-- 不被搜索引擎收录 -->
<meta name="description" content="只给一个人看的小站">
<title>给江鑫颖的小站 💗</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小站">
<style>
  /* ===================== 基础 ===================== */
  :root{
    --pink:#ff8fb8; --pink-deep:#ff5f9e; --pink-soft:#ffe6f0;
    --ink:#5a3a47; --ink-soft:#8b6b78; --card:#ffffffd9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(175deg,#ffeaf3 0%,#ffe1ee 40%,#ffeef6 100%);
    background-attachment:fixed;
    padding:14px 14px calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  /* 漂浮爱心/小花 */
  .floaty{position:fixed; top:-40px; font-size:20px; opacity:.75; pointer-events:none; animation:fall linear infinite; z-index:0;}
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0deg); opacity:0}
    10%{opacity:.85}
    100%{transform:translateY(115vh) rotate(320deg); opacity:0}
  }
  .wrap{position:relative; z-index:1; max-width:520px; margin:0 auto;}

  /* ===================== 顶部天数 ===================== */
  .days-badge{
    margin:6px auto 16px;
    text-align:center;
    background:linear-gradient(135deg,#ff9ec4,#ff6aa6);
    color:#fff;
    border-radius:26px;
    padding:18px 16px 20px;
    box-shadow:0 10px 26px rgba(255,110,165,.38), inset 0 -3px 0 rgba(255,255,255,.35);
    position:relative;
    overflow:hidden;
  }
  .days-badge::after{ /* 顶部斜光 */
    content:""; position:absolute; top:-60%; left:-30%; width:80%; height:200%;
    background:linear-gradient(90deg,#ffffff00,#ffffff55,#ffffff00);
    transform:rotate(18deg); animation:shine 4.5s ease-in-out infinite;
  }
  @keyframes shine{0%,60%{left:-40%}100%{left:120%}}
  .days-badge .bow{font-size:22px}
  .days-line{font-size:16px; letter-spacing:1px; opacity:.95; margin:2px 0 6px}
  .days-num{
    font-size:64px; line-height:1; font-weight:800;
    text-shadow:0 4px 0 rgba(190,60,110,.35);
    display:inline-block; animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes pop{from{transform:scale(.5); opacity:0}to{transform:scale(1); opacity:1}}
  .days-unit{font-size:20px; font-weight:700; margin-left:6px}
  .days-sub{font-size:13px; opacity:.92; margin-top:8px}
  .days-name{font-weight:700}

  /* ===================== 打招呼卡片 ===================== */
  .hello{
    background:var(--card); backdrop-filter:blur(6px);
    border-radius:20px; padding:16px 18px; margin-bottom:14px;
    box-shadow:0 6px 18px rgba(255,140,180,.18);
    display:flex; align-items:center; gap:12px;
  }
  .hello .kitty{flex:0 0 58px}
  .hello .txt{font-size:15.5px; line-height:1.65}
  .hello .hi{font-weight:800; color:var(--pink-deep); font-size:16px; margin-bottom:3px}

  /* ===================== 信息卡片 ===================== */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .card{
    background:var(--card); backdrop-filter:blur(6px);
    border-radius:18px; padding:14px 12px;
    box-shadow:0 6px 16px rgba(255,140,180,.16);
    text-align:center; min-height:104px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  .card .ico{font-size:24px}
  .card .k{font-size:12px; color:var(--ink-soft)}
  .card .v{font-size:19px; font-weight:800; color:var(--pink-deep); line-height:1.25}
  .card .v small{font-size:12px; font-weight:600; color:var(--ink-soft)}
  .card.wide{grid-column:1 / -1; min-height:auto; text-align:left; align-items:flex-start; padding:16px}
  .card.wide .k{margin-bottom:6px}
  .card.wide .v{font-size:15px; font-weight:600; color:var(--ink); line-height:1.75; text-align:left}

  /* 照片框 */
  .photo-card{grid-column:1 / -1; padding:12px}
  .photo-frame{
    width:100%; border-radius:14px; overflow:hidden; background:#fff6fa;
    border:3px dashed #ffc2d9;
    display:flex; align-items:center; justify-content:center;
    aspect-ratio:4/3;
  }
  .photo-frame img{width:100%; height:100%; object-fit:cover; display:block}
  .photo-frame .ph{font-size:13px; color:var(--ink-soft); text-align:center; padding:14px; line-height:1.7}
  .photo-tip{font-size:11.5px; color:#b58ba0; text-align:center; margin-top:8px}

  /* ===================== 按钮 ===================== */
  .heart-btn{
    width:100%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#ff9ec4,#ff5f9e);
    color:#fff; font-size:17px; font-weight:800; letter-spacing:2px;
    padding:16px; border-radius:20px; margin:4px 0 14px;
    box-shadow:0 10px 22px rgba(255,95,158,.35);
    transition:transform .12s;
  }
  .heart-btn:active{transform:scale(.97)}
  .secret{
    background:#fff7fb; border:2px solid #ffd7e6; border-radius:18px;
    padding:14px 16px; margin-bottom:14px; font-size:15px; line-height:1.8;
    display:none; animation:pop .5s ease both;
  }
  .secret.on{display:block}
  .secret b{color:var(--pink-deep)}

  /* ===================== 底部 ===================== */
  footer{text-align:center; font-size:12px; color:#b58ba0; line-height:1.9; padding:6px 0 4px}
  footer .sign{font-weight:700; color:var(--pink-deep)}
  .addtip{
    margin-top:10px; background:#fff4f9; border:1.5px dashed #ffc2d9; border-radius:14px;
    padding:10px 12px; font-size:12px; color:#a8778e; text-align:left; line-height:1.8;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 顶部：在一起第 N 天（每天自动 +1） ============ -->
  <div class="days-badge">
    <div class="bow">💗</div>
    <div class="days-line">恋爱第</div>
    <div><span class="days-num" id="days">29</span><span class="days-unit">天</span></div>
    <div class="days-sub">和 <span class="days-name">江鑫颖</span> 在一起的日子 · 每天都比昨天更喜欢你</div>
  </div>

  <!-- ============ 打招呼 ============ -->
  <div class="hello">
    <div class="kitty">
      <!-- 原创可爱小猫（粉色蝴蝶结） -->
      <svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
        <ellipse cx="32" cy="38" rx="20" ry="17" fill="#fff" stroke="#ff9ec4" stroke-width="2"/>
        <path d="M14 24 L18 8 L30 20 Z" fill="#fff" stroke="#ff9ec4" stroke-width="2"/>
        <path d="M50 24 L46 8 L34 20 Z" fill="#fff" stroke="#ff9ec4" stroke-width="2"/>
        <circle cx="25" cy="36" r="2.6" fill="#5a3a47"/>
        <circle cx="39" cy="36" r="2.6" fill="#5a3a47"/>
        <ellipse cx="32" cy="43" rx="3" ry="2.2" fill="#ffb3cd"/>
        <path d="M14 39 L6 36 M14 43 L6 45 M50 39 L58 36 M50 43 L58 45" stroke="#ffc2d9" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <g transform="translate(46,16)">
          <path d="M0 0 L-7 -5 L-7 5 Z" fill="#ff6aa6"/>
          <path d="M0 0 L7 -5 L7 5 Z" fill="#ff6aa6"/>
          <circle cx="0" cy="0" r="2.4" fill="#ff9ec4"/>
        </g>
      </svg>
    </div>
    <div class="txt">
      <div class="hi" id="greet">晚上好呀～</div>
      <div id="helloMsg">今天也要开开心心的哦！</div>
    </div>
  </div>

  <!-- ============ 卡片区 ============ -->
  <div class="grid">
    <div class="card">
      <div class="ico">⏱️</div>
      <div class="k">我们已经在一起</div>
      <div class="v" id="together">—</div>
    </div>
    <div class="card">
      <div class="ico">🎀</div>
      <div class="k">距离第 100 天</div>
      <div class="v" id="to100">—</div>
    </div>

    <div class="card wide">
      <div class="k">💌 今天想对你说</div>
      <div class="v" id="quote">—</div>
    </div>

    <div class="card photo-card">
      <div class="k" style="margin-bottom:8px">📸 我们的照片</div>
      <div class="photo-frame">
        <img id="photo" src="photo.jpg" alt="我们的照片" onerror="this.style.display='none';document.getElementById('phTip').style.display='block'">
        <div class="ph" id="phTip" style="display:none">把你们的合照命名为 <b>photo.jpg</b><br>放进同一个文件夹，这里就会显示啦～</div>
      </div>
      <div class="photo-tip">（现在还空着的话，就把合照放进去吧）</div>
    </div>
  </div>

  <!-- ============ 隐藏情话按钮 ============ -->
  <button class="heart-btn" id="btn">💗 点我一下 💗</button>
  <div class="secret" id="secret">
    <b>江鑫颖</b>，遇见你之后，日子好像都变甜了。<br>
    以后也要一起去吃好多好吃的、看好多风景，<br>
    每天都想让你笑一下 —— 就像现在这样。 🥰
  </div>

  <footer>
    <div class="sign">—— 朱景澈 为你做的 ——</div>
    <div id="clock">—</div>
    <div class="addtip" id="addtip"></div>
  </footer>
</div>

<script>
/* ============================================================
   在一起的天数：改这一行就能改纪念日
   START = 在一起的「第一天」（含当天计算）
   当前设置：2026-08-30 为第 1 天 → 2026-09-27 显示第 29 天
   ============================================================ */
const START = new Date(2026, 7, 30);   // 月份从 0 开始：7 = 8 月
const DAY_MS = 24 * 60 * 60 * 1000;

function daysTogether(now = new Date()) {
  const a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.floor((b - a) / DAY_MS) + 1;      // 含当天
}
function pad(n) { return String(n).padStart(2, '0'); }

/* ---------- 天数与时长（每秒刷新，跨零点自动 +1） ---------- */
const $ = (id) => document.getElementById(id);
function renderDays() {
  const now = new Date();
  const d = daysTogether(now);
  $('days').textContent = d;
  document.title = '在一起第 ' + d + ' 天 💗';

  // 已在一起：X 天 X 小时 X 分 X 秒
  const ms = now - START;
  const dd = Math.floor(ms / DAY_MS);
  const hh = Math.floor(ms % DAY_MS / 3600000);
  const mm = Math.floor(ms % 3600000 / 60000);
  const ss = Math.floor(ms % 60000 / 1000);
  $('together').innerHTML = dd + ' 天 ' + hh + ' 时<br><small>' + pad(mm) + ' 分 ' + pad(ss) + ' 秒</small>';

  // 距离第 100 天
  const left = 100 - d;
  $('to100').innerHTML = left > 0 ? (left + ' 天') : '已达成 🎉';

  // 现在时间
  $('clock').textContent = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
    + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}

/* ---------- 问候语（按时段） ---------- */
function renderGreet() {
  const h = new Date().getHours();
  let g = '晚上好呀～', m = '今天辛苦啦，早点休息，梦里也要有我 🌙';
  if (h >= 5 && h < 11) { g = '早上好呀～'; m = '起床啦，记得吃早饭，今天也要元气满满！☀️'; }
  else if (h >= 11 && h < 14) { g = '中午好～'; m = '午饭吃了吗？别凑合，好好吃饭才有力气可爱 🍚'; }
  else if (h >= 14 && h < 18) { g = '下午好～'; m = '喝口水休息一下，你是最棒的小宝宝！💪'; }
  else if (h >= 18 && h < 23) { g = '晚上好呀～'; m = '今天也谢谢你陪着我，想你了 💗'; }
  $('greet').textContent = g;
  $('helloMsg').textContent = m;
}

/* ---------- 今日情话（每天换一句，同一天固定） ---------- */
const QUOTES = [
  '你笑起来的时候，我这边天气就晴了。',
  '想和你把普通的日子，一天一天过成纪念日。',
  '今天也很喜欢你，比昨天多一点，比明天少一点。',
  '你在我这儿，永远是优先级最高的事情。',
  '不用很厉害，你只要开开心心做你自己就好。',
  '遇见你之后，我才知道心动是会一直持续的事。',
  '以后的路可能很长，但我想一直牵着你的手走。',
  '你是我所有计划里，最确定的那一项。',
  '想把好吃的第一口都留给你。',
  '你困了我就安静一点，你开心我就跟着笑。'
];
function renderQuote() {
  const now = new Date();
  const seed = now.getFullYear() * 372 + (now.getMonth() + 1) * 31 + now.getDate();
  $('quote').textContent = QUOTES[seed % QUOTES.length];
}

/* ---------- 漂浮爱心 ---------- */
(function floaty() {
  const chars = ['💗', '🎀', '💕', '🌸', '💖'];
  for (let i = 0; i < 12; i++) {
    const el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = chars[i % chars.length];
    el.style.left = (Math.random() * 96) + 'vw';
    el.style.fontSize = (14 + Math.random() * 14) + 'px';
    el.style.animationDuration = (9 + Math.random() * 9) + 's';
    el.style.animationDelay = (-Math.random() * 12) + 's';
    document.body.appendChild(el);
  }
})();

/* ---------- 点我：爱心爆炸 + 显示情话 ---------- */
$('btn').addEventListener('click', function () {
  $('secret').classList.add('on');
  const chars = ['💗', '💖', '💕', '🎀', '🌸', '✨'];
  const r = this.getBoundingClientRect();
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('div');
    s.textContent = chars[i % chars.length];
    s.style.cssText = 'position:fixed;left:' + (r.left + r.width / 2) + 'px;top:' + (r.top + r.height / 2)
      + 'px;font-size:' + (14 + Math.random() * 16) + 'px;pointer-events:none;z-index:99;transition:transform 1.1s ease-out,opacity 1.1s ease-out';
    document.body.appendChild(s);
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 150;
    requestAnimationFrame(() => {
      s.style.transform = 'translate(' + Math.cos(ang) * dist + 'px,' + (Math.sin(ang) * dist - 60) + 'px) rotate(' + (Math.random() * 360) + 'deg)';
      s.style.opacity = '0';
    });
    setTimeout(() => s.remove(), 1300);
  }
  if (navigator.vibrate) navigator.vibrate(30);
});

/* ---------- 加到主屏幕提示（按系统给不同说明） ---------- */
(function addTip() {
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (standalone) { $('addtip').innerHTML = '已经加到主屏幕啦～以后点图标就能打开 💗'; return; }
  $('addtip').innerHTML = isIOS
    ? '💡 想随时打开：点底部「分享」→「添加到主屏幕」，桌面就会出现一个小图标，点一下就能看啦。'
    : '💡 想随时打开：点浏览器右上角菜单 →「添加到主屏幕」，就会像 App 一样有个图标。';
})();

renderDays(); renderGreet(); renderQuote();
setInterval(renderDays, 1000);
setInterval(() => { renderGreet(); renderQuote(); }, 60000);

/* ---------- 离线缓存（有网时缓存，没网也能打开） ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
